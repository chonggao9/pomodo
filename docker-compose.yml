version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowtask_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowtask
      POSTGRES_PASSWORD: flowtask_dev_2026
      POSTGRES_DB: flowtask
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtask"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowtask_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass flowtask_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "flowtask_redis_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
